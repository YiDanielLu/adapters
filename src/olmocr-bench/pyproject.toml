[project]
name = "harbor-olmocr-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for olmOCR-Bench (AllenAI): single-page PDF-to-Markdown OCR with rule-based unit tests"
readme = "README.md"
authors = [
    { name = "Yi Lu", email = "81632945+YiDanielLu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.30",
]

[project.scripts]
olmocr-bench = "olmocr_bench.main:main"
olmocr-bench-aggregate = "olmocr_bench.aggregate:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "olmocr_bench"

[tool.uv.sources]
olmocr = { url = "https://github.com/allenai/olmocr/archive/f7cfe4c22098b154c76b6ec950d1c0a464eecf8d.tar.gz" }

[dependency-groups]
dev = [
    "beautifulsoup4==4.13.5",
    "fuzzysearch==0.8.0",
    "lxml==6.0.2",
    "olmocr",
    "playwright==1.55.0",
    "rapidfuzz==3.14.3",
    "tqdm==4.67.1",
]
