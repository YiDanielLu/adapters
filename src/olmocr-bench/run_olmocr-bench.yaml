jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  # type: daytona
  # Every task shares the same grader/Chromium layers; only the final COPY of the PDF
  # differs, so keep Docker's layer cache instead of force-rebuilding 1,403 images.
  force_build: false
  delete: true
  # env:
  #   ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  #   ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
  #   DAYTONA_API_KEY: ${DAYTONA_API_KEY}
# Default: oracle agent (reference solutions built from the unit tests)
agents:
  - name: oracle
# Uncomment to run with other agents:
# agents:
#   - name: claude-code
#     model_name: anthropic/claude-haiku-4-5
# agents:
#   - name: codex
#     model_name: openai/gpt-5-mini
datasets:
  - path: datasets/olmocr-bench
