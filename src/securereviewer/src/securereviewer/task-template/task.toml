version = "1.0"

[task]
name = "{task_name}"
description = "SecureReviewer: write a security-focused code review (type, description, impact, advice) for one code change; scored with SecureBLEU."
authors = [
    { name = "Fang Liu" },
    { name = "Simiao Liu" },
    { name = "Yinghao Zhu" },
    { name = "Xiaoli Lian" },
    { name = "Li Zhang" },
]
keywords = ["code-review", "security", "secure-code-review", "securebleu"]

[metadata]
benchmark = "securereviewer"
difficulty = "medium"
category = "secure-code-review"
source_split = "test"
source_index = {source_index}
security_type = "{security_type}"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
